[workspace]
resolver = "2"
members = ["crates/oru-lang", "crates/oru-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = ""

[workspace.dependencies]
oru-lang = { path = "crates/oru-lang" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
